[package]
name = "rostr"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14", features = ["canvas", "image", "svg", "advanced", "tokio"] }
lucide-icons = { version = "0.562", features = ["iced"] }
once_cell = "1.19"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.49.0", features = ["time", "rt-multi-thread", "macros"] }
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
csv = "1.4.0"
rust_xlsxwriter = "0.93.0"
rusqlite = { version = "0.38.0", features = ["bundled", "chrono"] }
rand = "0.8.5"
thiserror = "2.0.18"
dirs = "6.0.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
printpdf = "0.7"
regex = "1.10"
async-stream = "0.3"
dotenvy = "0.15"
